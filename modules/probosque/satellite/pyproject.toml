[project]
name = "satellite"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Antxnszn", email = "rnavarroe1700@alumno.ipn.mx" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pydantic>=2.9.0",
    "scipy>=1.14.0",
    "shapely>=2.0.6",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

