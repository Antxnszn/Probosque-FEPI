name: probosque

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: probosque-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-probosque}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-probosque_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-probosque_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-probosque} -d ${POSTGRES_DB:-probosque_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: probosque-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: alpine/minio:latest-release
    container_name: probosque-minio
    restart: unless-stopped
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-probosque_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-probosque_minio_pass_2026}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/wget -q -O - http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: pgsty/mc:latest
    container_name: probosque-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-probosque_admin} ${MINIO_ROOT_PASSWORD:-probosque_minio_pass_2026};
      mc mb --ignore-existing local/${MINIO_BUCKET_NAME:-probosque-evidence};
      mc anonymous set download local/${MINIO_BUCKET_NAME:-probosque-evidence};
      exit 0;
      "

  docs:
    image: squidfunk/mkdocs-material:latest
    container_name: probosque-docs
    restart: unless-stopped
    ports:
      - "${DOCS_PORT:-8008}:8000"
    volumes:
      - ..:/docs

  backend:
    build:
      context: ../modules/probosque/backend
      dockerfile: Dockerfile
    container_name: probosque-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-probosque}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-probosque_secret_2026}
      - POSTGRES_DB=${POSTGRES_DB:-probosque_db}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-probosque}:${POSTGRES_PASSWORD:-probosque_secret_2026}@db:5432/${POSTGRES_DB:-probosque_db}
      - SYNC_DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-probosque}:${POSTGRES_PASSWORD:-probosque_secret_2026}@db:5432/${POSTGRES_DB:-probosque_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-probosque_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-probosque_minio_pass_2026}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-probosque-evidence}
      - MINIO_USE_SSL=false
      - DATA_DIR=/data/inegi
      - CONFIG_DIR=/pipelines/configs
    volumes:
      - ../data:/data:ro
      - ../modules/probosque/pipelines/configs:/pipelines/configs:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: probosque-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_BACKEND_URL=http://backend:8000
      - VITE_ORQUESTADOR_URL=http://orquestador:8010
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  db-init:
    image: postgres:16-alpine
    container_name: probosque-db-init
    restart: "no"
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-probosque}
      PGDATABASE: ${POSTGRES_DB:-probosque_db}
      PGPASSWORD: ${POSTGRES_PASSWORD:-probosque_secret_2026}
      FEPI_DB_PASSWORD: ${FEPI_DB_PASSWORD:-fepi_dev_2026}
    volumes:
      - ./postgres/init-fepi.sh:/init-fepi.sh:ro
    entrypoint: ["/bin/sh", "/init-fepi.sh"]
    depends_on:
      db:
        condition: service_healthy

  orquestador:
    build:
      context: ../services/orquestador
    container_name: probosque-orquestador
    restart: unless-stopped
    ports:
      - "${ORQUESTADOR_PORT:-8010}:8010"
    environment:
      DATABASE_URL: postgresql+asyncpg://fepi_orquestador:${FEPI_DB_PASSWORD:-fepi_dev_2026}@db:5432/fepi_orquestador
      SYNC_DATABASE_URL: postgresql+psycopg://fepi_orquestador:${FEPI_DB_PASSWORD:-fepi_dev_2026}@db:5432/fepi_orquestador
      REDIS_URL: redis://redis:6379/0
      FECHA_OPERACION: ${FECHA_OPERACION:-}
      VISOR_URL: http://backend:8000
      CONVOCATORIAS_URL: http://convocatorias:8011
      EXPEDIENTE_DIGITAL_URL: http://expediente-digital:8012
      DICTAMINACION_URL: http://dictaminacion:8013
      FORMALIZACION_SEGUIMIENTO_URL: http://formalizacion-seguimiento:8014
      METRICAS_CIERRE_URL: http://metricas-cierre:8015
      INTERNO_TOKEN: ${FEPI_INTERNO_TOKEN:-fepi_interno_dev}
      SECRETO: ${FEPI_SECRETO:-fepi_tramite_dev}
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8010/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 25s

  convocatorias:
    build:
      context: ../services/convocatorias
    container_name: probosque-convocatorias
    restart: unless-stopped
    ports:
      - "${CONVOCATORIAS_PORT:-8011}:8011"
    environment:
      DATABASE_URL: postgresql+asyncpg://fepi_convocatorias:${FEPI_DB_PASSWORD:-fepi_dev_2026}@db:5432/fepi_convocatorias
      SYNC_DATABASE_URL: postgresql+psycopg://fepi_convocatorias:${FEPI_DB_PASSWORD:-fepi_dev_2026}@db:5432/fepi_convocatorias
      REDIS_URL: redis://redis:6379/0
      INTERNO_TOKEN: ${FEPI_INTERNO_TOKEN:-fepi_interno_dev}
      ARCHIVOS_DIR: /var/probosque/convocatorias
    volumes:
      - convocatorias_archivos:/var/probosque/convocatorias
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8011/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 25s

  expediente-digital:
    build:
      context: ../services/expediente-digital
    container_name: probosque-expediente-digital
    restart: unless-stopped
    ports:
      - "${EXPEDIENTE_DIGITAL_PORT:-8012}:8012"
    environment:
      DATABASE_URL: postgresql+asyncpg://fepi_expediente_digital:${FEPI_DB_PASSWORD:-fepi_dev_2026}@db:5432/fepi_expediente_digital
      SYNC_DATABASE_URL: postgresql+psycopg://fepi_expediente_digital:${FEPI_DB_PASSWORD:-fepi_dev_2026}@db:5432/fepi_expediente_digital
      REDIS_URL: redis://redis:6379/0
      INTERNO_TOKEN: ${FEPI_INTERNO_TOKEN:-fepi_interno_dev}
      ARCHIVOS_DIR: /var/probosque/tramite
    volumes:
      - tramite_archivos:/var/probosque/tramite
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8012/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 25s

  dictaminacion:
    build:
      context: ../services/dictaminacion
    container_name: probosque-dictaminacion
    restart: unless-stopped
    ports:
      - "${DICTAMINACION_PORT:-8013}:8013"
    environment:
      DATABASE_URL: postgresql+asyncpg://fepi_dictaminacion:${FEPI_DB_PASSWORD:-fepi_dev_2026}@db:5432/fepi_dictaminacion
      SYNC_DATABASE_URL: postgresql+psycopg://fepi_dictaminacion:${FEPI_DB_PASSWORD:-fepi_dev_2026}@db:5432/fepi_dictaminacion
      REDIS_URL: redis://redis:6379/0
      INTERNO_TOKEN: ${FEPI_INTERNO_TOKEN:-fepi_interno_dev}
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8013/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 25s

  formalizacion-seguimiento:
    build:
      context: ../services/formalizacion-seguimiento
    container_name: probosque-formalizacion-seguimiento
    restart: unless-stopped
    ports:
      - "${FORMALIZACION_SEGUIMIENTO_PORT:-8014}:8014"
    environment:
      DATABASE_URL: postgresql+asyncpg://fepi_formalizacion_seguimiento:${FEPI_DB_PASSWORD:-fepi_dev_2026}@db:5432/fepi_formalizacion_seguimiento
      SYNC_DATABASE_URL: postgresql+psycopg://fepi_formalizacion_seguimiento:${FEPI_DB_PASSWORD:-fepi_dev_2026}@db:5432/fepi_formalizacion_seguimiento
      REDIS_URL: redis://redis:6379/0
      INTERNO_TOKEN: ${FEPI_INTERNO_TOKEN:-fepi_interno_dev}
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8014/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 25s

  metricas-cierre:
    build:
      context: ../services/metricas-cierre
    container_name: probosque-metricas-cierre
    restart: unless-stopped
    ports:
      - "${METRICAS_CIERRE_PORT:-8015}:8015"
    environment:
      DATABASE_URL: postgresql+asyncpg://fepi_metricas_cierre:${FEPI_DB_PASSWORD:-fepi_dev_2026}@db:5432/fepi_metricas_cierre
      SYNC_DATABASE_URL: postgresql+psycopg://fepi_metricas_cierre:${FEPI_DB_PASSWORD:-fepi_dev_2026}@db:5432/fepi_metricas_cierre
      REDIS_URL: redis://redis:6379/0
      INTERNO_TOKEN: ${FEPI_INTERNO_TOKEN:-fepi_interno_dev}
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8015/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 25s

  nginx:
    image: nginx:1.27-alpine
    container_name: probosque-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - orquestador

volumes:
  postgres_data:
  redis_data:
  tramite_archivos:
  convocatorias_archivos:
  minio_data:
