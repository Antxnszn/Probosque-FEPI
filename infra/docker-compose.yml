version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: probosque-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-probosque}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-probosque_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-probosque_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-probosque} -d ${POSTGRES_DB:-probosque_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: probosque-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: probosque-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-probosque_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-probosque_minio_pass_2026}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2024-03-30T15-32-47Z
    container_name: probosque-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-probosque_admin} ${MINIO_ROOT_PASSWORD:-probosque_minio_pass_2026};
      /usr/bin/mc mb --ignore-existing local/${MINIO_BUCKET_NAME:-probosque-evidence};
      /usr/bin/mc anonymous set download local/${MINIO_BUCKET_NAME:-probosque-evidence};
      exit 0;
      "

  docs:
    image: squidfunk/mkdocs-material:latest
    container_name: probosque-docs
    restart: unless-stopped
    ports:
      - "${DOCS_PORT:-8008}:8000"
    volumes:
      - ..:/docs


volumes:
  postgres_data:
  redis_data:
  minio_data:
