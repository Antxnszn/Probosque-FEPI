worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 32m;

        # Se resuelve al pedir la ruta. Nginx arranca aunque el visor esté apagado.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # El tramite entra solo al orquestador. Los cinco servicios no se publican aqui.
        location /api/tramite {
            set $destino_tramite orquestador:8010;
            proxy_pass http://$destino_tramite;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # La calculadora y el visor conservan /api/v1.
        location /api/ {
            set $destino_visor backend:8000;
            proxy_pass http://$destino_visor;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health {
            set $destino_visor_salud backend:8000;
            proxy_pass http://$destino_visor_salud;
        }

        location / {
            set $destino_interfaz frontend:5173;
            proxy_pass http://$destino_interfaz;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
