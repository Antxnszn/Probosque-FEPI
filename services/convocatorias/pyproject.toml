[project]
name = "fepi-convocatorias"
version = "0.1.0"
description = "Servicio FEPI"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.3",
    "asyncpg>=0.29.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.12",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.5.0",
    "redis>=5.0.8",
    "sqlalchemy>=2.0.35",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
